<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOTS English Institute</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

    <!-- Header / Navbar -->
    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="ROOTS Logo" class="h-11 w-11 rounded-full object-cover border-2 border-emerald-700 shadow">
                <div>
                    <span class="text-xl font-bold tracking-tight text-emerald-900 block leading-tight">ROOTS</span>
                    <span class="text-xs text-slate-500 font-medium">English Institute</span>
                </div>
            </div>
            <nav class="space-x-6 text-sm font-semibold">
                <a href="{{ url_for('dashboard') }}" class="text-slate-600 hover:text-emerald-700 transition">Dashboard</a>
                <a href="{{ url_for('student_panel') }}" class="text-slate-600 hover:text-emerald-700 transition">Student Panel</a>
                <a href="{{ url_for('teacher_panel') }}" class="text-slate-600 hover:text-emerald-700 transition">Teacher Panel</a>
                <a href="{{ url_for('info_page') }}" class="text-slate-600 hover:text-emerald-700 transition">Info</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow max-w-7xl mx-auto px-4 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500">
        &copy; 2026 ROOTS English Institute, Kushtia. All rights reserved.
    </footer>

</body>
</html>
