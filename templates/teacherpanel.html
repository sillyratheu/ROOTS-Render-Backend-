{% extends "base.html" %}
{% block content %}
<div class="max-w-sm mx-auto py-16">
    <div class="bg-white p-8 rounded-2xl border border-slate-200 shadow-sm">
        <h2 class="text-xl font-bold text-slate-900 mb-1 text-center">Teacher Panel</h2>
        <p class="text-xs text-slate-500 text-center mb-6">Restricted access for Mithu Sir only.</p>

        {% if error %}
        <div class="bg-rose-50 border border-rose-200 text-rose-700 text-xs p-3 rounded-xl mb-4">{{ error }}</div>
        {% endif %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Teacher ID</label>
                <input type="text" name="teacher_id" required placeholder="123454" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-700">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 mb-1">Secret Password</label>
                <input type="password" name="password" required placeholder="mithu123@teacher" class="w-full border border-slate-300 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-emerald-700">
            </div>
            <button type="submit" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-xl text-sm transition shadow">Secure Login</button>
        </form>
    </div>
</div>
{% endblock %}
